; TrueMed - Component 5 - ESP32 cold-chain temperature sensor
; "Truth in Every Medicine"
;
; Two build environments, and the split is the point:
;
;   [env:esp32dev]  the real firmware, cross-compiled for the ESP32.
;   [env:host]      the same pure-logic sources compiled for this PC and run as a
;                   test binary. No Arduino, no hardware, no ESP32 toolchain.
;
; Everything security-relevant - the HMAC, the temperature formatting the HMAC
; covers, the offline queue, the send/sleep policy - lives in src/truemed/ and is
; free of Arduino headers so that env:host can compile it byte for byte as the
; device does. Hardware access lives in src/device/ behind small interfaces.
;
; This matters because you cannot step through a sleeping battery-powered board
; in a fridge. The bugs that would otherwise only appear there - a 4.5 that the
; server reads as "4.50" while the device signed "4.5", a queue that loses the
; oldest reading instead of the newest - are ordinary unit tests here.
;
;   pio run -e host -t exec      # build + run the logic tests on this PC
;   pio run -e esp32dev          # build firmware
;   pio run -e esp32dev -t upload
;   pio device monitor           # serial provisioning console
;
; A plain `make -C test/host` also works if you have gcc but not PlatformIO.

[platformio]
default_envs = esp32dev
description = TrueMed cold-chain sensor: DS18B20 + ESP32, HMAC-signed readings to the TrueMed API

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DTRUEMED_FIRMWARE_VERSION=\"1.0.0\"

; ---------------------------------------------------------------------------
; The real device
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; 115200 is the ESP32 bootloader's own rate, so the boot log and the
; provisioning console read at one speed and you never have to switch mid-session.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 921600

build_flags =
    ${common.build_flags}
    -DTRUEMED_TARGET_ESP32=1
    ; ArduinoJson is deliberately absent: the request body is built by
    ; src/truemed/reading.cpp so that the exact bytes the HMAC covers are
    ; produced by code the host tests exercise. A JSON library on the device
    ; and hand-built bytes in the test would be two serialisers, which is the
    ; drift this project has already been bitten by once.
    -DCORE_DEBUG_LEVEL=1

; Pinned exactly. A DS18B20 driver that changes its rounding between minor
; versions changes what the device signs.
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0

; LittleFS, not SPIFFS. SPIFFS is deprecated in the ESP32 Arduino core, has no
; real directory support, and degrades badly when nearly full - which is exactly
; the state an offline buffer reaches during the multi-day outage it exists for.
board_build.filesystem = littlefs
board_build.partitions = partitions_truemed.csv

; ---------------------------------------------------------------------------
; Host test build - pure logic only
; ---------------------------------------------------------------------------
[env:host]
platform = native
build_flags =
    ${common.build_flags}
    -DTRUEMED_TARGET_HOST=1
    -O1
    -g
    -Isrc
    -Itest/host
build_src_filter = +<truemed/> +<../test/host/>
