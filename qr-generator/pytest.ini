# TrueMed QR generator — pytest configuration.
#
# The fallback runner (tools/run_tests.py) ignores this file entirely; it hardcodes
# its own discovery so the suite still runs on an air-gapped machine with no pytest.
# This file configures *real* pytest, which gives better failure output when it is
# available.
#
# `pythonpath = .` is the load-bearing line: it puts the project root (this
# directory) on sys.path so `from truemed_qr.cli import main` resolves the working
# tree, regardless of how pytest's import-mode heuristics would otherwise guess.
# Do NOT set `testpaths` to a value that shadows this, and do not import top-level
# modules like `main` from inside tests — import through the `truemed_qr` package.

[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra prints a one-line reason for every skip at the end, so the nine
# qrcode/opencv skips are visible rather than silent.
addopts = -ra
